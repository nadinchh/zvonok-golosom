name: Собрать APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Скачать офлайн-модель русской речи (Vosk small ru)
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-ru-0.22 app/src/main/assets/model-ru
          echo "small-ru-0.22" > app/src/main/assets/model-ru/uuid
      - name: Сборка
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZvonokGolosom-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ZvonokGolosom.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Звонок голосом 1.0.${{ github.run_number }}
          files: ZvonokGolosom.apk
